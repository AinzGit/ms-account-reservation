databaseChangeLog:
  - changeSet:
      id: 002-create-account-status
      author: ainzgit
      changes:
        - createTable:
            tableName: account_status
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(255)

  - changeSet:
      id: 003-create-client
      author: ainzgit
      changes:
        - createTable:
            tableName: client
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(255)
              - column:
                  name: citizenship
                  type: VARCHAR(255)
              - column:
                  name: client_type
                  type: VARCHAR(255)
              - column:
                  name: document_number
                  type: VARCHAR(255)
              - column:
                  name: document_series
                  type: VARCHAR(255)
              - column:
                  name: document_type
                  type: VARCHAR(255)
              - column:
                  name: mdm_code
                  type: BIGINT

  - changeSet:
      id: 004-create-account
      author: ainzgit
      changes:
        - createTable:
            tableName: account
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: status_id
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: client_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: account_type
                  type: VARCHAR(255)

              - column:
                  name: currency_code
                  type: VARCHAR(255)

  - changeSet:
      id: 005-add-account-foreign-keys
      author: ainzgit
      changes:
        - addForeignKeyConstraint:
            baseTableName: account
            baseColumnNames: status_id
            referencedTableName: account_status
            referencedColumnNames: id
            constraintName: fk_account_status

        - addForeignKeyConstraint:
            baseTableName: account
            baseColumnNames: client_id
            referencedTableName: client
            referencedColumnNames: id
            constraintName: fk_account_client
